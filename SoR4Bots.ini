; RageBots v1.0 settings (the file keeps its old SoR4Bots name)
; Lines starting with ; are comments. Save the file and restart the game after a change.

[General]
; How much to write to SoR4Bots.log: Error, Info or Debug
LogLevel=Info
; Steam Input fallback. Only used with AttachMode=Auto:
; if no real controller shows up within this many seconds (keyboard player, or Steam Input
; hiding the pad), the bot pads are plugged in anyway. 0 = off (don't wait).
InputFallbackSeconds=5
; 1 = write extra lines to the log that help fix the mod after a game update
; (layouts found, addresses searched, controller details). Default: on.
Diagnostics=1

[Bots]
; The bots are switched on and off in the game: press F7 to open the bots menu.
; The menu saves its choices here when you close it. You can also edit them here
; (with the game closed):
;   PnBot       1 = on, 0 = off (default: every bot off). P2Bot is the bot for
;               player 2, and so on. A bot only ever takes a FREE player slot: if you
;               or a friend already play as P2, the P2 bot plays as the next free
;               player instead (or waits if all 4 are taken).
;               P3Bot needs P2Bot=1 and P4Bot needs P3Bot=1; otherwise it is
;               read as 0.
;   PnCharacter Auto (keep the fighter the game gives it) or a fighter name exactly
;               as the menu shows it.
;   PnColor     Default (the color the game gives; "Auto" from older builds means the
;               same) or a color number (1 = the fighter's first color).
;   PnAggression Low, Normal or High: how often the bot dodges, jumps in with
;               moves and grabs, and how much life it keeps for specials. (Not in
;               the F7 menu yet; edit it here with the game closed.)
P2Bot=0
P2Character=Auto
P2Color=Default
P2Aggression=Normal
P3Bot=0
P3Character=Auto
P3Color=Default
P3Aggression=Normal
P4Bot=0
P4Character=Auto
P4Color=Default
P4Aggression=Normal
; When bots that are ON may plug in their pads:
;   OnF7 = only after you first press F7 in the game window in this session (default).
;          Your own controllers are always found first, so they keep the lower numbers.
;   Auto = by themselves once your controllers have settled (see SettleMs,
;          InputFallbackSeconds), without pressing F7.
AttachMode=OnF7
; 1 = same as AttachMode=Auto (kept for older settings files).
StartActive=0
; Auto mode only: never plug in before this many ms after the game starts its controllers.
AttachDelayMs=2000
; Auto mode only: wait this long after the last real controller appeared.
SettleMs=1500
; 1 = if a real controller is plugged in while the bots are switched off, briefly unplug the
; bot pads so the real controller gets the lower number, then plug them back in.
; Off by default: unplugging a bot that is already in a stage can upset the game's
; player slots. With F7 attach your controllers are found first anyway.
ReorderLatePads=0

[Input]
; 1 = use only the controller drivers the game's own SDL had (Xbox pads through XInput), so one
; Xbox pad can't show up twice through SDL 2.32's newer RawInput / Windows.Gaming.Input drivers.
LegacyInputDrivers=1
; 1 = if the same pad still shows up twice (same model, different driver, within 3 seconds),
; only the first copy is given to the game.
HideDuplicatePads=1

[Brain]
; Smart = reads the game to find enemies. If the game can't be read, the bot stays still
; (see FallbackToTestPattern).
; Test  = a simple timed walk-and-attack pattern (for testing only).
Mode=Smart
; Buttons the bot presses during a stage (A, B, X, Y, LB, RB, Up, Down, Left, Right).
; Start and Back are never pressed, even if set here.
AttackButton=X
JumpButton=A
SpecialButton=Y
; Specials cost life, so the bot only uses attacking specials at or above this much life
; (percent), and keeps attacking afterwards to win the green (recoverable) life back.
; UseSpecials=0 turns all specials off (also the defensive ones and the star move).
UseSpecials=1
SpecialMinLifePercent=60
; The defensive special (Y with no direction: a short invincible spin) to get out when
; surrounded or when an attack is coming, at or above this much life (percent).
DefensiveSpecialMinLifePercent=40
; Star moves (they use a star, not life): only near a boss, with 4 or more enemies close,
; or in an emergency. StarButton: Auto (read the game's control option), RB, or Y+B.
UseStarMoves=1
StarButton=Auto
; Back attack when an enemy is behind the bot: RT (default controls), BackX (tap back
; then X; use this if your controls have no back-attack button), or Off.
BackAttack=RT
; 1 = grab enemies (knees, throws toward other enemies or walls, character grab moves).
UseGrabs=1
; 1 = pick up food, weapons and grenades with B (only in a stage, never in a menu).
UsePickups=1
; The bot eats food only below this much life (percent), and leaves it for player 1
; if player 1 needs it as much or more.
FoodLifePercent=75
; Money, stars and weapons on the floor: players get this many seconds to pick them up
; first; after that a bot may take them (food follows FoodLifePercent above instead).
PlayerItemHeadStartSec=10
; 1 = when there is nothing to fight, the bots break sinks, crates and other breakable
; objects near player 1 (they often hide money or food).
BreakObjects=1
; 1 = jump moves: jump-in kicks, air hits on enemies in the air, jump kicks into a crowd,
; an air special when healthy, Blaze's jump-cancel combo. Limited to one every 1.5 s and
; 6 per 20 s; paused at an enemy that hits the bot out of the air. 0 = never.
JumpAttacks=1
; 1 = bots mostly FIGHT with melee weapons (pipe, bat, sword...). They throw one only when
; it is nearly broken (30% life or less) with an enemy in the lane, or when an enemy in the lane
; is far away (4.5+), nobody has been in reach for 6 s and they have held it 10 s. Knives may be
; thrown from 4+ away (about 4 pickups in 10). At most one melee throw per bot every 15 s.
; Never with player 1 or another player in the throw lane while friendly fire is on (or
; unknown). Bottles and other throw-only items are always thrown. 0 = melee weapons only swung.
WeaponThrows=1
; Friendly fire only (the game option): 1 = a bot hit by a human player hits that player back,
; one light hit per hit taken (at most 10 owed, forgotten after 20 s without a chance). Bots
; never hit back at other bots, and bot-on-bot hits are never counted. 0 = never hit back.
FriendlyRetaliate=1
; Below this much life (percent) the bot backs off behind player 1.
RetreatLifePercent=30
; Low life never comes back by itself, so the bot only backs off for this long (ms), then
; fights again for 5 seconds before backing off again. 0 = back off for as long as life is low.
RetreatMaxMs=2500
; 1 = if the game can't be read at all, run the simple timed pattern (walk and attack
; blindly). 0 (default) = keep the bot pad still instead.
FallbackToTestPattern=0
; Character select. Normally the bot reads the game's character select screen and moves
; its own cursor to the fighter and color picked in the F7 menu, confirms once, and stops
; (see README). Only if the mod can't read that screen (for example after a game update)
; does it fall back to the older rule: tap A to confirm, about every 0.7 s, for at most
; this many seconds, only right after F7, never once a stage has run, in a pause or in any
; other menu. Only A, never anything else. 0 = off.
MenuConfirmSeconds=10
; ...and at most this many A taps per round.
MenuConfirmMaxTaps=6
; The bot presses nothing while the game window is not in front, and waits this long (ms)
; after you click or Alt+Tab back into the game.
FocusGraceMs=1500
; The bot presses nothing while the game is paused (pause menu, options), and waits this
; long (ms) after the game is unpaused.
ResumeGraceMs=750
; Distances in game units (the screen is about 19 wide and 11 tall). 0 = work it out from
; the screen size (recommended: about 1.25 for AttackRange and 0.3 for LaneTolerance).
AttackRange=0
LaneTolerance=0
FollowDistance=0
; Combo: this many attack taps, ComboTapMs apart, then a pause. Known fighters use their
; own string length instead (Axel 5, Blaze 4, Cherry 4, Adam 3, ...); ComboHits is used for
; the rest.
ComboHits=4
ComboTapMs=110
ComboPauseMs=350

[TestBrain]
; Used when Mode=Test (or FallbackToTestPattern=1 and the game can't be read).
; To join, the bot taps JoinButton JoinPresses times, but only while it is not playing yet.
JoinButton=A
JoinPresses=2
AttackButton=X
AttackIntervalMs=700
WalkMs=1500
; Every Nth attack becomes a jump (A) instead. 0 = never jump.
JumpEveryNAttacks=0

[Debug]
; 1 = write positions and life of every fighter to the log every DumpEveryNFrames frames
; (60 frames = 1 second). Default: off (it makes the log large).
DumpState=0
DumpEveryNFrames=120
; Write what each bot decided and why (target, distance, lane gap, or why it is
; standing still) every this many milliseconds. 0 = off (default).
BrainLogEveryMs=0
; Write what player 1 is doing (position, speed, facing, stick, attacking) every this
; many milliseconds, so the bots' behaviour around you can be checked. Read only. 0 = off.
P1WatchLogEveryMs=0
